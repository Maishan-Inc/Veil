[package]
name = "veil-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
sha2 = "0.10"
zip = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
regex = "1"
toml = "0.8"
tempfile = { workspace = true }
veil-core = { path = "../core" }

[dev-dependencies]
tempfile = { workspace = true }
zip = "2.2"
# Dev-only: the `#[ignore]`d detection-baseline launcher spawns the engine through the real
# bridge instead of reimplementing the launch. Not a runtime dependency of this crate.
veil-bridge = { workspace = true }
